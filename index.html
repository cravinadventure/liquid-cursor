<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>liquid-cursor</title>
<meta name="description" content="A GPU fluid cursor trail in one file. No dependencies. By Cravin' Adventure Studios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ground: #050308;
    --ink: #ece5fb;
    --muted: #8f84a8;
    --magenta: #d65cf4;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--ground); }
  body {
    margin: 0;
    min-height: 100svh;
    background: transparent;  /* the canvas sits behind at z-index -1 */
    color: var(--ink);
    font-family: var(--mono);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .plate { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px; }
  h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 500;
    letter-spacing: .02em;
    text-shadow: 0 2px 30px rgba(5, 3, 8, .95);
  }
  p {
    margin: 0;
    font-size: 10px;
    letter-spacing: .26em;
    text-transform: uppercase;
    color: var(--muted);
    text-shadow: 0 1px 20px rgba(5, 3, 8, .95);
  }
  a {
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--magenta);
    text-decoration: none;
    border: 1px solid rgba(214, 92, 244, .32);
    border-radius: 2px;
    padding: 8px 14px;
    justify-self: center;
    transition: color .2s ease, border-color .2s ease;
  }
  a:hover, a:focus-visible { color: var(--ink); border-color: rgba(214, 92, 244, .8); outline: none; }
</style>
</head>
<body>

<div class="plate">
  <h1>liquid&#8209;cursor</h1>
  <p>Move your pointer</p>
  <a href="https://github.com/cravinadventure/liquid-cursor">Get it on GitHub</a>
</div>

<script src="./liquid-cursor.min.js" data-drift="0.25" data-gain="0.15"></script>
</body>
</html>
